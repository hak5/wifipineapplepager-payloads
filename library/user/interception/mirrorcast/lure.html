<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display Ready</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080d18;
    --card: #141c30;
    --line: #223050;
    --text: #e9eefb;
    --muted: #93a1c2;
    --blue: #2f6df6;
    --cyan: #77e7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 50% -10%, #132750 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, #17203a, var(--card));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px 30px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .screen {
    width: 112px;
    height: 76px;
    margin: 0 auto 24px;
    border: 2px solid #3a5488;
    border-radius: 10px;
    background: radial-gradient(circle at 50% 58%, #77e7ff 0%, #2f6df6 34%, #12306f 66%, #0b1734 100%);
    box-shadow: 0 0 44px rgba(47, 109, 246, .55);
    position: relative;
  }
  .screen::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -14px;
    width: 44px;
    height: 8px;
    transform: translateX(-50%);
    border-radius: 0 0 6px 6px;
    background: #3a5488;
  }
  h1 { font-size: 23px; margin: 18px 0 8px; letter-spacing: .2px; }
  p { color: var(--muted); line-height: 1.55; margin: 0 auto; max-width: 330px; }
  .bar {
    height: 6px;
    background: #0a1224;
    border-radius: 99px;
    overflow: hidden;
    margin: 26px 0 10px;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 42%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    animation: slide 2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -45%; }
    100% { margin-left: 105%; }
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
    font-size: 12px;
    color: #6c7ba0;
  }
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 6px;
    border-radius: 50%;
    background: #46d39a;
    box-shadow: 0 0 12px #46d39a;
    vertical-align: middle;
  }
  small {
    display: block;
    margin-top: 26px;
    color: #4f5d7e;
    font-size: 10px;
    letter-spacing: .9px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="screen" aria-hidden="true"></div>
    <h1>Display Ready</h1>
    <p>This screen is available to receive photos, video, music and documents from devices on the network.</p>
    <div class="bar"><i></i></div>
    <div class="row">
      <span><span class="dot"></span>Connected</span>
      <span>Ready to cast</span>
    </div>
    <small>MIRRORCAST &middot; authorized testing only</small>
  </main>
</body>
</html>
