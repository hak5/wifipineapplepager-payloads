<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #10261a 0%, #070d09 60%, #040706 100%);
    color: #d7e6dd; padding: 22px;
  }
  .card {
    width: min(400px, 100%); text-align: center;
    background: rgba(14,26,19,.9); border: 1px solid #1f4a30;
    border-radius: 18px; padding: 38px 26px;
    box-shadow: 0 24px 80px rgba(0,0,0,.65);
  }
  .ring {
    width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(65,232,139,.22), transparent 70%);
    border: 2px solid #41e88b; box-shadow: 0 0 30px rgba(65,232,139,.35);
  }
  .ring svg { width: 38px; height: 38px; }
  h1 { margin: 0 0 8px; font-size: 23px; }
  p { margin: 0; color: #8ba99a; font-size: 14px; line-height: 1.55; }
</style>
</head>
<body>
  <main class="card">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#41e88b" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h1>You're connected</h1>
    <p>Authentication complete. You can close this window and continue browsing.</p>
  </main>
</body>
</html>
